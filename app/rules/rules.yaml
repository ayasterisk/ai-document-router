      - { ten: "Chi cục Quản lý đất đai", vai_tro: "xử lý chính" }
    confidence: 0.96

  - id: "IV.4"
    name: "Thông báo cơ quan Thuế: nộp tiền cấp quyền khai thác khoáng sản / thuế tài nguyên"
