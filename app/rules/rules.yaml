    recipients:
      - { ten: "Văn phòng Đăng ký đất đai", vai_tro: "xử lý chính" }
    confidence: 0.95

  - id: "IV.7"
    name: "TT Phát triển quỹ đất thông báo kết quả đấu giá QSDĐ"
    keywords: ["dau gia quyen su dung dat", "dau gia dat", "ket qua dau gia"]
    recipients:
      - { ten: "Chi cục Quản lý đất đai", vai_tro: "xử lý chính" }
    confidence: 0.95

  - id: "IV.8"
