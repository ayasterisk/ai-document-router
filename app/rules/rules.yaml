    don_vi: ["Chi cục Chăn nuôi và Thú y", "TT Quy hoạch NN&MT", "TT Giống Nông nghiệp"]

  - id: "III.hoan"
    lanh_dao: "PGĐ Nguyễn Văn Hoan"
    cap: "PGĐ"
    keywords: ["lam nghiep", "kiem lam", "rung phong ho", "rung dac dung", "rung trong", "rung san xuat", "go lon", "bao ton thien nhien", "khu bao ton", "ho tro phat trien rung"]
    don_vi: ["Chi cục Kiểm lâm", "BQL rừng phòng hộ", "BQL Rừng đặc dụng An Toàn", "BQL Khu bảo tồn thiên nhiên Kon Chư Răng"]

  - id: "III.huong"
