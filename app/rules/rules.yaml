# =====================================================================
# RULES.YAML — Rule engine "phân luồng văn bản đến" của Sở NN&MT tỉnh Gia Lai
# Nguồn chuẩn hóa: doc/rulebase.md (bản chính)
# Bổ trợ suy luận:  doc/tu-dien-linh-vuc.yaml, doc/van-phong-reference.md
#
# QUY ƯỚC KHI SỬA:
#  - keyword viết chữ thường, KHÔNG DẤU. Engine tự chuẩn hóa văn bản đầu vào
#    (bỏ dấu, lowercase, nén khoảng trắng, "&" -> " va ") trước khi so khớp.
#  - Thứ tự ưu tiên do engine thực thi theo "Nguyên tắc áp dụng" của rulebase:
#      1. Văn bản khẩn (Mục V)  (*)    4. Giao chủ trì / TB kết luận (Mục I, II.1)
#      2. Ngoại lệ đặc biệt (Mục IV)   5. Quy tắc chung theo nguồn (Mục II.1-II.3)
#      3. Giấy mời (Mục II.4)         + lĩnh vực phụ trách (Mục III)
#  (*) Lệch so với thứ tự ghi trong rulebase: khẩn được kiểm tra TRƯỚC ngoại lệ
#      IV.10/IV.11 vì keyword trùng nhau; nếu ngược lại thì Mục V (chuyển song
#      song) sẽ không bao giờ có hiệu lực cho thủy lợi/thủy sản.
#  - Mỗi mục dừng ở quy tắc ĐẦU TIÊN khớp (trừ lĩnh vực Mục III chạy điểm tín hiệu).
# =====================================================================
version: "0.1.0"
nguon: ["doc/rulebase.md", "doc/tu-dien-linh-vuc.yaml", "doc/van-phong-reference.md"]

# ---------- 1. NGOẠI LỆ ĐẶC BIỆT (Mục IV) — ưu tiên cao nhất ----------
exceptions:
  - id: "IV.1"
    name: "Đối thoại giải quyết khiếu nại"
    keywords: ["doi thoai giai quyet khieu nai"]
    recipients:
      - { ten: "Phạm Quý Phương - Phó Chánh Văn phòng", vai_tro: "xử lý chính" }
      - { ten: "Trần Thị Bảo Chi - Phòng Kinh tế đất", vai_tro: "xử lý chính" }
    confidence: 0.97

  - id: "IV.2"
    name: "Giải quyết đơn, khiếu nại, tố cáo, kiến nghị"
    keywords: ["khieu nai", "to cao", "kien nghi", "don thu", "giai quyet don", "tiep cong dan", "tiep dan"]
    recipients:
      - { ten: "Phạm Quý Phương - Phó Chánh Văn phòng", vai_tro: "xử lý chính" }
      - { ten: "Trần Thị Bảo Chi - Phòng Kinh tế đất", vai_tro: "xử lý chính" }
    confidence: 0.95
    ghi_chu: "Nhóm xử lý khiếu nại/tố cáo/kiến nghị: 1 đại diện Văn phòng Sở + 1 chuyên viên Chi cục Quản lý đất đai."

  - id: "IV.3"
    name: "Thông báo cơ quan Thuế: nộp tiền thuê đất / thu hồi đất / chậm nợ thuế"
