# ---------- 2. VĂN BẢN KHẨN (Mục V) — chuyển SONG SONG ----------
urgent:
  detect_tokens: ["khan", "hoa toc", "khan cap", "nguy cap"]  # so khớp TOÀN TỪ (vd "Công văn khẩn")
  routes:
    - id: "V.1"
      keywords: ["thuy loi", "cong trinh thuy loi", "thien tai", "phong chong lut bao", "ao ho dam pha"]
      recipients:
        - { ten: "PGĐ Vũ Ngọc An", vai_tro: "xử lý chính (song song)" }
        - { ten: "Chi cục Thủy lợi", vai_tro: "xử lý chính (song song)" }
      confidence: 0.96
    - id: "V.2"
      keywords: ["khai thac tai nguyen nuoc", "nuoc duoi dat", "nuoc mat", "gieng khoan", "gieng dao"]
      recipients:
        - { ten: "PGĐ Vũ Ngọc An", vai_tro: "xử lý chính (song song)" }
        - { ten: "Phòng Tài nguyên nước", vai_tro: "xử lý chính (song song)" }
      confidence: 0.96
    - id: "V.3"
      keywords: ["thuy san", "tau ca", "su co tran dau", "nhan chim vat chat", "chong khai thac iuu"]
      recipients:
        - { ten: "PGĐ Trần Quốc Khánh", vai_tro: "xử lý chính (song song)" }
        - { ten: "Chi cục Thủy sản", vai_tro: "xử lý chính (song song)" }
      confidence: 0.96
    - id: "V.4"
      keywords: ["cang ca", "ben ca", "khu neo dau tran tru bao"]
      recipients:
        - { ten: "PGĐ Trần Quốc Khánh", vai_tro: "xử lý chính (song song)" }
