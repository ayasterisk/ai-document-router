    recipients:
      - { ten: "PGĐ Trần Đình Chương", vai_tro: "xử lý chính" }
      - { ten: "Phòng Địa chất Khoáng sản", vai_tro: "xử lý chính" }
    confidence: 0.96

  - id: "IV.5"
