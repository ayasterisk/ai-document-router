# ---------- 4. GIAO CHỦ TRÌ / THÔNG BÁO KẾT LUẬN (Mục I, II.1) ----------
# Luôn qua Giám đốc Sở BÚT PHÊ TRƯỚC, sau đó mới theo lĩnh vực.
central_directive:
  keywords: ["giao so nong nghiep va moi truong chu tri", "giao so nn va mt chu tri", "thong bao ket luan", "ket luan cua thuong truc ubnd", "ket luan cua chu tich", "thong bao ket luan cua ubnd tinh", "thong bao ket luan cua hdnd"]
  recipients:
    - { ten: "Giám đốc Sở (Cao Thanh Thương)", vai_tro: "bút phê trước" }
  confidence: 0.90

# ---------- 5. MÃ KÝ HIỆU SỐ VĂN BẢN -> ĐƠN VỊ/LÃNH ĐẠO (tu-dien-linh-vuc.yaml) ----------
# Tín hiệu phụ: nếu số văn bản chứa mã đơn vị, tăng điểm cho lĩnh vực tương ứng.
ma_ky_hieu:
  KL:    { don_vi: "Chi cục Kiểm lâm", lanh_dao: "PGĐ Nguyễn Văn Hoan", linh_vuc: "Lâm nghiệp, Kiểm lâm" }
  QLDD:  { don_vi: "Chi cục Quản lý đất đai", lanh_dao: "Giám đốc Cao Thanh Thương", linh_vuc: "Quản lý đất đai" }
  CNTY:  { don_vi: "Chi cục Chăn nuôi và Thú y", lanh_dao: "PGĐ Đoàn Ngọc Có", linh_vuc: "Chăn nuôi và Thú y" }
  TNN:   { don_vi: "Phòng Tài nguyên nước và KTTV", lanh_dao: "PGĐ Vũ Ngọc An", linh_vuc: "Tài nguyên nước, KTTV" }
  VPDK:  { don_vi: "Văn phòng Đăng ký đất đai", lanh_dao: "Giám đốc Cao Thanh Thương", linh_vuc: "Đăng ký đất đai" }

# ---------- 6. LĨNH VỰC PHỤ TRÁCH (Mục III — QĐ 899/QĐ-SNNMT) ----------
# Engine chấm điểm: keyword dài (cụ thể) hơn -> trọng số cao hơn.
# Nhiều lãnh đạo cùng điểm -> "tổng hợp nhiều lĩnh vực" -> theo quy tắc Mục II.
field_routes:
  - id: "III.gd"
    lanh_dao: "Giám đốc Cao Thanh Thương"
    cap: "GĐ"
    keywords: ["quy hoach", "ke hoach chung", "chinh sach chung", "to chuc can bo", "can bo", "thi dua", "khen thuong", "ky luat", "phong chong tham nhung", "thuc hanh tiet kiem", "dan van", "cai cach hanh chinh", "chuyen doi so", "cong tac van phong"]
    don_vi: ["Phòng TCCB", "Phòng KH-TC", "TT Chuyển đổi số NN&MT", "Quỹ Phòng chống thiên tai"]

  - id: "III.gd_datdai"
    lanh_dao: "Giám đốc Cao Thanh Thương"
    cap: "GĐ"
    keywords: ["dat dai", "giay chung nhan", "thua dat", "giao dat", "cho thue dat", "thu hoi dat", "dang ky dat dai", "ke khai dat dai", "quyen su dung dat"]
    don_vi: ["Chi cục Quản lý đất đai", "Văn phòng Đăng ký đất đai"]
    sub_routes:
      - id: "III.gd_datdai_qldd"
        keywords: ["giao dat", "cho thue dat", "thua dat", "giay chung nhan quyen su dung dat", "thu hoi dat", "dau gia quyen su dung dat", "tach thua", "bien dong dat dai"]
        don_vi: ["Chi cục Quản lý đất đai"]
      - id: "III.gd_datdai_vpdk"
        keywords: ["dang ky dat dai", "ke khai dat dai", "dang ky lan dau", "mat phoi", "dang ky bien dong", "dat dang ky"]
        don_vi: ["Văn phòng Đăng ký đất đai"]

  - id: "III.tran"
    lanh_dao: "PGĐ Nguyễn Thị Tố Trân"
    cap: "PGĐ"
    keywords: ["trong trot", "bao ve thuc vat", "khuyen nong", "chat luong nong san", "chat luong lam san", "chat luong thuy san", "giong cay trong", "phong chong dich hai"]
    don_vi: ["Chi cục Trồng trọt và BVTV", "Chi cục QL chất lượng NLTS", "TT Khuyến nông"]

  - id: "III.co"
    lanh_dao: "PGĐ Đoàn Ngọc Có"
    cap: "PGĐ"
