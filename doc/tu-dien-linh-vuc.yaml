# Mục đích: nạp vào context Claude (few-shot) khi rule cứng trong rules.yaml
#           không match rõ ràng trên trích yếu văn bản đến.
# LƯU Ý: đây là tín hiệu hỗ trợ suy luận (soft signal), KHÔNG phải rule cứng
#        thay thế rulebase.md — không dùng để tự động quyết định nếu confidence thấp.

